repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=5000']

  - repo: local
    hooks:
      - id: black
        name: black
        entry: python -m black
        language: system
        types: [python]

      - id: ruff
        name: ruff
        entry: python -m ruff check --fix
        language: system
        types: [python]

      - id: detect-secrets
        name: detect-secrets
        entry: python -m detect_secrets.pre_commit_hook
        language: system
        args: ['--baseline', '.secrets.baseline']
